<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finanzas de la casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2ECDE;
    --paper-light:#FAF6EC;
    --line:#CFC4A6;
    --ink:#1F3A3D;
    --ink-soft:#5C7070;
    --green:#2F6F4E;
    --green-bg:#E3EEE6;
    --red:#A63A2C;
    --red-bg:#F4E5E1;
    --gold:#B8842A;
    --gold-bg:#F1E6D2;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{font-size:17px;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',Georgia,serif;}
  button, input, select{font-family:inherit;font-size:1rem;color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- header ---------- */
  header.top{
    background:var(--ink);
    color:var(--paper-light);
    padding:1.1rem 1.25rem 0.9rem;
    position:sticky;
    top:0;
    z-index:20;
  }
  header.top h1{
    margin:0 0 0.7rem;
    font-size:1.35rem;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .month-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .month-nav button{
    background:none;
    border:none;
    color:var(--paper-light);
    padding:0.35rem 0.6rem;
    min-height:44px;
    min-width:44px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .month-nav button svg{width:20px;height:20px;}
  .month-nav .month-label{
    font-size:1.05rem;
    font-weight:500;
    text-transform:capitalize;
  }

  /* ---------- content ---------- */
  .content{
    flex:1;
    padding:1.25rem 1.25rem calc(96px + env(safe-area-inset-bottom));
    overflow-y:auto;
  }
  .section{display:none;}
  .section.active{display:block;}

  .section-title{
    font-size:1.05rem;
    font-weight:600;
    margin:0 0 0.6rem;
    padding-bottom:0.5rem;
    border-bottom:1px solid var(--line);
  }
  .block{margin-bottom:2rem;}
  .block:last-child{margin-bottom:0;}

  .muted{color:var(--ink-soft);font-size:0.85rem;}
  .empty-state{
    color:var(--ink-soft);
    font-size:0.92rem;
    padding:0.75rem 0;
    line-height:1.5;
  }
  .link-btn{
    background:none;border:none;padding:0;
    color:var(--ink);text-decoration:underline;
    text-underline-offset:3px;
    cursor:pointer;font-size:inherit;
  }

  /* ---------- saldo ---------- */
  .saldo-label{font-size:0.85rem;color:var(--ink-soft);margin-bottom:0.15rem;}
  .saldo-num{font-size:2.5rem;font-weight:600;line-height:1.1;margin-bottom:0.6rem;}
  .saldo-num.pos{color:var(--green);}
  .saldo-num.neg{color:var(--red);}
  .saldo-stats{display:flex;gap:1.5rem;}
  .saldo-stat .k{font-size:0.78rem;color:var(--ink-soft);}
  .saldo-stat .v{font-size:1.05rem;font-weight:600;}
  .saldo-stat.ing .v{color:var(--green);}
  .saldo-stat.gas .v{color:var(--red);}

  /* ---------- bar rows (categorías) ---------- */
  .bar-row{padding:0.55rem 0;border-bottom:1px solid var(--line);}
  .bar-row:last-child{border-bottom:none;}
  .bar-row-top{display:flex;justify-content:space-between;font-size:0.92rem;margin-bottom:0.35rem;}
  .bar-row-top .amt{font-weight:600;font-variant-numeric:tabular-nums;}
  .bar-track{height:7px;background:var(--line);border-radius:2px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--ink-soft);border-radius:2px;}
  .bar-fill.over{background:var(--red);}
  .bar-fill.warn{background:var(--gold);}
  .bar-fill.ok{background:var(--green);}

  /* ---------- list rows (movimientos / cuentas) ---------- */
  .row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:0.6rem;
    padding:0.65rem 0;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:none;}
  .row-main{min-width:0;}
  .row-desc{font-size:0.97rem;font-weight:500;}
  .row-meta{font-size:0.8rem;color:var(--ink-soft);margin-top:0.1rem;}
  .row-right{display:flex;align-items:center;gap:0.5rem;flex-shrink:0;}
  .row-amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .row-amt.ing{color:var(--green);}
  .row-amt.gas{color:var(--red);}
  .del-btn{
    background:none;border:none;color:var(--ink-soft);
    font-size:1.15rem;line-height:1;cursor:pointer;
    padding:0.3rem;min-width:32px;min-height:32px;
  }
  .del-btn:hover{color:var(--red);}

  .pill{
    font-size:0.75rem;font-weight:600;padding:0.25rem 0.55rem;
    border-radius:20px;white-space:nowrap;
  }
  .pill.pagado{background:var(--green-bg);color:var(--green);}
  .pill.pendiente{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);}
  .pill.atrasado{background:var(--red-bg);color:var(--red);}
  .pill.pop{animation:pop 0.3s ease;}
  @keyframes pop{0%{transform:scale(0.7);opacity:0;}100%{transform:scale(1);opacity:1;}}

  .pay-btn{
    background:var(--ink);color:var(--paper-light);border:none;
    font-size:0.82rem;font-weight:600;padding:0.4rem 0.7rem;
    border-radius:3px;cursor:pointer;white-space:nowrap;
  }

  .pay-form{
    margin-top:0.5rem;padding:0.75rem;background:var(--paper-light);
    border:1px solid var(--line);border-radius:3px;
  }
  .pay-form .row-inline{display:flex;gap:0.6rem;align-items:flex-end;flex-wrap:wrap;}
  .pay-form label{font-size:0.78rem;color:var(--ink-soft);display:block;margin-bottom:0.2rem;}

  /* ---------- forms ---------- */
  .form-block{
    background:var(--paper-light);
    border:1px solid var(--line);
    border-radius:4px;
    padding:1rem;
    margin-bottom:1.5rem;
  }
  .field{margin-bottom:0.85rem;}
  .field label{
    display:block;font-size:0.78rem;color:var(--ink-soft);margin-bottom:0.25rem;
  }
  .field input, .field select{
    width:100%;
    border:none;
    border-bottom:1.5px solid var(--ink-soft);
    background:transparent;
    padding:0.4rem 0.1rem;
    font-size:1rem;
  }
  .field input:focus, .field select:focus{border-bottom-color:var(--ink);}
  .toggle-group{display:flex;gap:0.5rem;margin-bottom:0.85rem;}
  .toggle-group button{
    flex:1;padding:0.55rem;border:1.5px solid var(--line);
    background:var(--paper);border-radius:3px;cursor:pointer;
    font-weight:600;font-size:0.92rem;color:var(--ink-soft);
  }
  .toggle-group button.active.ing{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .toggle-group button.active.gas{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .toggle-group button.active.clp,
  .toggle-group button.active.usd{background:var(--gold-bg);border-color:var(--gold);color:var(--gold);}
  .fx-hint{font-size:0.78rem;color:var(--ink-soft);margin-top:0.4rem;line-height:1.4;}
  .fx-hint .refresh-link{
    background:none;border:none;color:var(--gold);font-size:inherit;
    text-decoration:underline;text-underline-offset:2px;cursor:pointer;
    padding:0;margin-left:0.3rem;
  }
  .checkbox-row{display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;color:var(--ink-soft);}
  .checkbox-row input{width:18px;height:18px;}

  .submit-btn{
    width:100%;background:var(--ink);color:var(--paper-light);
    border:none;border-radius:3px;padding:0.75rem;
    font-size:0.97rem;font-weight:600;cursor:pointer;margin-top:0.2rem;
  }
  .submit-btn:active{opacity:0.85;}

  .budget-row{padding:0.7rem 0;border-bottom:1px solid var(--line);}
  .budget-row:last-child{border-bottom:none;}
  .budget-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem;}
  .budget-row-top .cat{font-weight:500;}
  .budget-input{
    display:flex;align-items:center;gap:0.3rem;
  }
  .budget-input span{color:var(--ink-soft);font-size:0.9rem;}
  .budget-input input{
    width:6.5rem;border:none;border-bottom:1.5px solid var(--line);
    background:transparent;text-align:right;padding:0.2rem 0.1rem;
    font-size:0.92rem;
  }
  .budget-progress-label{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--ink-soft);margin-top:0.3rem;}

  /* ---------- bottom nav ---------- */
  nav.bottom{
    position:sticky;
    bottom:0;
    background:var(--ink);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    z-index:20;
  }
  nav.bottom .nav-indicator{
    position:absolute;
    top:0;
    left:0;
    width:25%;
    height:2px;
    background:var(--gold);
    transform:translateX(0);
  }
  @media (prefers-reduced-motion: no-preference){
    nav.bottom .nav-indicator{transition:transform 0.25s ease;}
  }
  nav.bottom button{
    flex:1;
    background:none;border:none;
    color:#8FA3A3;
    padding:0.55rem 0.2rem 0.5rem;
    display:flex;flex-direction:column;align-items:center;gap:0.2rem;
    cursor:pointer;min-height:56px;
  }
  nav.bottom button svg{width:21px;height:21px;}
  nav.bottom button span{font-size:0.68rem;font-weight:500;}
  nav.bottom button.active{color:var(--paper-light);}

  /* ---------- toast ---------- */
  .toast{
    position:fixed;
    bottom:0;left:0;right:0;
    max-width:480px;margin:0 auto;
    background:var(--ink);color:var(--paper-light);
    padding:0.85rem 1.1rem;
    display:none;
    align-items:center;justify-content:space-between;
    gap:1rem;
    transform:translateY(100%);
    z-index:30;
    font-size:0.9rem;
  }
  .toast.show{display:flex;transform:translateY(-72px);}
  @media (prefers-reduced-motion: no-preference){
    .toast{transition:transform 0.25s ease;}
  }
  .toast button{
    background:none;border:none;color:var(--gold);font-weight:600;
    cursor:pointer;flex-shrink:0;
  }

  .loading-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    color:var(--paper-light);font-family:'Fraunces',serif;font-size:1.1rem;
    background:var(--ink);
  }

  /* ---------- login ---------- */
  .login-screen{
    min-height:100vh;background:var(--ink);color:var(--paper-light);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    padding:2rem;gap:1.4rem;text-align:center;
  }
  .login-screen h2{font-size:1.35rem;font-weight:600;margin:0;}
  .login-screen .subtitle{color:#9FB0B0;font-size:0.88rem;margin-top:-0.6rem;}
  .user-cards{display:flex;gap:1rem;width:100%;max-width:360px;}
  .user-card{
    flex:1;background:var(--paper-light);color:var(--ink);border:none;
    border-radius:6px;padding:1.7rem 1rem;font-family:'Fraunces',serif;
    font-size:1.1rem;font-weight:600;cursor:pointer;
  }
  .user-card:active{opacity:0.85;}

  /* ---------- fila de usuario en el encabezado ---------- */
  .user-row{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:0.6rem;font-size:0.82rem;color:#B9C6C6;
  }
  .user-row button{
    background:none;border:none;color:var(--gold);
    font-size:0.78rem;cursor:pointer;padding:0.2rem;
  }

  /* ---------- gráfico de dona (presupuesto) ---------- */
  .donut-wrap{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;}
  .legend{flex:1;min-width:150px;}
  .legend-item{display:flex;align-items:center;gap:0.5rem;font-size:0.85rem;padding:0.25rem 0;}
  .legend-swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .legend-item .name{flex:1;}
  .legend-item .pct{color:var(--ink-soft);font-variant-numeric:tabular-nums;font-size:0.8rem;white-space:nowrap;}
</style>
</head>
<body>

<div id="loading" class="loading-screen">Abriendo el libro de cuentas…</div>

<div class="login-screen" id="loginScreen">
  <h2 class="serif">¿Quién está usando la app?</h2>
  <div class="subtitle">Elige tu nombre para identificar tus movimientos</div>
  <div class="user-cards" id="userCards">
    <button type="button" class="user-card" data-user="Alejandra">Alejandra</button>
    <button type="button" class="user-card" data-user="Leonardo">Leonardo</button>
  </div>
</div>

<div class="app" id="app" style="display:none;">

  <header class="top">
    <h1>Finanzas de la casa</h1>
    <div class="user-row">
      <span id="userGreeting"></span>
      <button type="button" id="switchUserBtn">Cambiar de usuario</button>
    </div>
    <div class="month-nav">
      <button id="prevMonth" aria-label="Mes anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <span class="month-label" id="monthLabel"></span>
      <button id="nextMonth" aria-label="Mes siguiente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </header>

  <div class="content">

    <!-- ================= INICIO ================= -->
    <section class="section active" id="sec-inicio">
      <div class="block">
        <div class="saldo-label">Saldo del mes</div>
        <div class="saldo-num" id="saldoNum">$0</div>
        <div class="saldo-stats">
          <div class="saldo-stat ing"><div class="k">Ingresos</div><div class="v" id="ingresoTotal">$0</div></div>
          <div class="saldo-stat gas"><div class="k">Gastos</div><div class="v" id="gastoTotal">$0</div></div>
        </div>
      </div>

      <div class="block">
        <div class="section-title">Gastos por categoría</div>
        <div id="categoriaChart"></div>
      </div>

      <div class="block">
        <div class="section-title">Próximos pagos</div>
        <div id="proximosPagos"></div>
      </div>
    </section>

    <!-- ================= MOVIMIENTOS ================= -->
    <section class="section" id="sec-movimientos">
      <div class="form-block">
        <div class="toggle-group" id="tipoToggle">
          <button type="button" class="active ing" data-tipo="ingreso">Ingreso</button>
          <button type="button" class="gas" data-tipo="gasto">Gasto</button>
        </div>
        <div class="toggle-group" id="monedaToggle">
          <button type="button" class="active clp" data-moneda="CLP">Pesos (CLP)</button>
          <button type="button" class="usd" data-moneda="USD">Dólares (USD)</button>
        </div>
        <div class="field">
          <label for="movFecha">Fecha</label>
          <input type="date" id="movFecha">
        </div>
        <div class="field">
          <label for="movCategoria">Categoría</label>
          <select id="movCategoria"></select>
        </div>
        <div class="field">
          <label for="movDescripcion">Descripción</label>
          <input type="text" id="movDescripcion" placeholder="Ej: Supermercado, sueldo, feria">
        </div>
        <div class="field">
          <label for="movMonto" id="movMontoLabel">Monto</label>
          <input type="number" id="movMonto" min="0" step="1" placeholder="0">
          <div class="fx-hint" id="fxHint" style="display:none;"></div>
        </div>
        <button class="submit-btn" id="addMovBtn">Agregar movimiento</button>
      </div>

      <div class="section-title" id="movListTitle">Movimientos</div>
      <div id="movList"></div>
    </section>

    <!-- ================= CUENTAS ================= -->
    <section class="section" id="sec-cuentas">
      <div class="form-block">
        <div class="field">
          <label for="cuentaNombre">Nombre</label>
          <input type="text" id="cuentaNombre" list="sugerenciasCuentas" placeholder="Ej: Luz, Agua, Internet">
          <datalist id="sugerenciasCuentas">
            <option value="Luz"><option value="Agua"><option value="Gas">
            <option value="Internet"><option value="Teléfono">
            <option value="Arriendo o dividendo"><option value="Gastos comunes">
            <option value="TV o streaming">
          </datalist>
        </div>
        <div class="field">
          <label for="cuentaMonto">Monto aproximado</label>
          <input type="number" id="cuentaMonto" min="0" step="1" placeholder="0">
        </div>
        <div class="field">
          <label for="cuentaDia">Día de vencimiento (1 al 31)</label>
          <input type="number" id="cuentaDia" min="1" max="31" placeholder="15">
        </div>
        <div class="checkbox-row">
          <input type="checkbox" id="cuentaRecurrente" checked>
          <label for="cuentaRecurrente" style="margin:0;">Se repite todos los meses</label>
        </div>
        <button class="submit-btn" id="addCuentaBtn" style="margin-top:0.85rem;">Agregar cuenta</button>
      </div>

      <div class="section-title">Cuentas registradas</div>
      <div id="cuentasList"></div>
    </section>

    <!-- ================= PRESUPUESTO ================= -->
    <section class="section" id="sec-presupuesto">
      <div class="block">
        <div class="section-title">Distribución del gasto</div>
        <div id="presupuestoChart"></div>
      </div>
      <div class="block">
        <div class="section-title" id="presupuestoTitle">Presupuesto del mes</div>
        <div id="presupuestoList"></div>
      </div>
    </section>

  </div>

  <nav class="bottom" id="bottomNav">
    <div class="nav-indicator" id="navIndicator"></div>
    <button class="active" data-target="inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10.5V20h12v-9.5"/></svg>
      <span>Inicio</span>
    </button>
    <button data-target="movimientos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h12v16l-3-2-3 2-3-2-3 2V4Z"/><path d="M9 9h6M9 13h6"/></svg>
      <span>Movimientos</span>
    </button>
    <button data-target="cuentas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M4 9.5h16M8 3v3.5M16 3v3.5"/></svg>
      <span>Cuentas</span>
    </button>
    <button data-target="presupuesto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 12 12 5.2A6.8 6.8 0 0 1 18.8 12Z"/></svg>
      <span>Presupuesto</span>
    </button>
  </nav>

  <div class="toast" id="toast">
    <span id="toastMsg"></span>
    <button id="toastUndo">Deshacer</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  var CATEGORIAS_GASTO = ['Alimentación','Transporte','Vivienda','Servicios básicos','Salud','Educación','Entretención','Otros'];
  var CATEGORIAS_INGRESO = ['Sueldo','Jubilación o pensión','Otro ingreso'];
  var CATEGORIA_COLORS = {
    'Alimentación':'#2F6F4E', 'Transporte':'#3D6B8A', 'Vivienda':'#8A5A3D',
    'Servicios básicos':'#B8842A', 'Salud':'#A63A2C', 'Educación':'#5C4A8A',
    'Entretención':'#C97B4A', 'Otros':'#6B6B5C'
  };
  var USERS = ['Alejandra','Leonardo'];
  var USER_SESSION_KEY = 'finanzas-hogar-usuario-sesion';
  var EXCHANGE_RATE_KEY = 'finanzas-hogar-tasa-usd';
  var EXCHANGE_RATE_MAX_AGE_MS = 7 * 24 * 60 * 60 * 1000; // 1 semana

  var state = null;
  var currentUser = null;
  var currentMonthDate = startOfMonth(new Date());
  var currentTipo = 'ingreso';
  var currentMoneda = 'CLP';
  var exchangeRate = null; // {valor, fechaValor, fetchedAt}
  var lastDeleted = null; // {kind:'movimiento'|'cuenta', item, index}
  var toastTimer = null;

  function defaultState(){
    return { movimientos: [], cuentas: [], pagos: {}, presupuestos: {} };
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  function startOfMonth(d){
    return new Date(d.getFullYear(), d.getMonth(), 1);
  }
  function monthKeyOf(d){
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function monthLabelOf(d){
    var s = d.toLocaleDateString('es-CL', {month:'long', year:'numeric'});
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function todayISO(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fmtMoney(n){
    n = Math.round(Number(n) || 0);
    try{
      return new Intl.NumberFormat('es-CL', {style:'currency', currency:'CLP', maximumFractionDigits:0}).format(n);
    }catch(e){
      return '$' + n;
    }
  }
  function fmtDateShort(iso){
    if(!iso) return '';
    var parts = iso.split('-');
    var d = new Date(Number(parts[0]), Number(parts[1])-1, Number(parts[2]));
    return d.toLocaleDateString('es-CL', {day:'2-digit', month:'short'});
  }

  // ---------- storage (localStorage: los datos quedan guardados en este navegador/celular) ----------
  var STORAGE_KEY = 'finanzas-hogar-estado-v1';
  async function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        state = JSON.parse(raw);
        if(!state.movimientos) state.movimientos = [];
        if(!state.cuentas) state.cuentas = [];
        if(!state.pagos) state.pagos = {};
        if(!state.presupuestos) state.presupuestos = {};
      } else {
        state = defaultState();
        await saveState();
      }
    }catch(e){
      state = defaultState();
      try{ await saveState(); }catch(e2){ console.error('No se pudo crear el estado inicial', e2); }
    }
  }
  async function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.error('Error guardando datos', e);
      showToast('No se pudo guardar. Revisa el espacio del navegador.', null);
    }
  }

  // ---------- tasa de cambio USD -> CLP (mindicador.cl, API pública del Banco Central de Chile) ----------
  function loadExchangeRateCache(){
    try{
      var raw = localStorage.getItem(EXCHANGE_RATE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveExchangeRateCache(obj){
    try{ localStorage.setItem(EXCHANGE_RATE_KEY, JSON.stringify(obj)); }catch(e){}
  }
  function rateNeedsRefresh(cache){
    if(!cache || !cache.fetchedAt) return true;
    return (Date.now() - new Date(cache.fetchedAt).getTime()) > EXCHANGE_RATE_MAX_AGE_MS;
  }
  async function ensureExchangeRate(forceRefresh){
    exchangeRate = loadExchangeRateCache();
    if(forceRefresh || rateNeedsRefresh(exchangeRate)){
      try{
        var res = await fetch('https://mindicador.cl/api/dolar');
        var data = await res.json();
        if(data && data.serie && data.serie.length){
          exchangeRate = {
            valor: data.serie[0].valor,
            fechaValor: String(data.serie[0].fecha || '').slice(0,10),
            fetchedAt: new Date().toISOString()
          };
          saveExchangeRateCache(exchangeRate);
        }
      }catch(e){
        console.error('No se pudo actualizar la tasa del dólar', e);
      }
    }
    updateFxHint();
  }
  function fmtUSD(n){
    n = Number(n) || 0;
    return 'US$' + n.toLocaleString('en-US', {minimumFractionDigits:0, maximumFractionDigits:2});
  }
  function updateFxHint(){
    var hint = document.getElementById('fxHint');
    if(!hint) return;
    if(currentMoneda !== 'USD'){ hint.style.display = 'none'; return; }
    hint.style.display = '';
    var montoVal = Number(document.getElementById('movMonto').value) || 0;
    if(exchangeRate && exchangeRate.valor){
      var clp = Math.round(montoVal * exchangeRate.valor);
      hint.innerHTML = 'Equivale a ' + fmtMoney(clp) + ' &middot; 1 USD = ' + fmtMoney(exchangeRate.valor) +
        ' (' + fmtDateShort(exchangeRate.fechaValor) + ')' +
        '<button type="button" class="refresh-link" id="refreshRateBtn">Actualizar tasa</button>';
    } else {
      hint.innerHTML = 'No se pudo obtener la tasa del dólar todavía.' +
        '<button type="button" class="refresh-link" id="refreshRateBtn">Reintentar</button>';
    }
  }

  // ---------- toast ----------
  function showToast(msg, undoFn){
    var toast = document.getElementById('toast');
    var undoBtn = document.getElementById('toastUndo');
    document.getElementById('toastMsg').textContent = msg;
    undoBtn.style.display = undoFn ? '' : 'none';
    undoBtn.onclick = function(){
      if(undoFn) undoFn();
      hideToast();
    };
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 5000);
  }
  function hideToast(){
    document.getElementById('toast').classList.remove('show');
  }

  // ---------- computations ----------
  function movimientosDelMes(mk){
    return state.movimientos.filter(function(m){ return m.fecha && m.fecha.slice(0,7) === mk; });
  }
  function totales(mk){
    var ing = 0, gas = 0;
    movimientosDelMes(mk).forEach(function(m){
      if(m.tipo === 'ingreso') ing += Number(m.monto)||0;
      else gas += Number(m.monto)||0;
    });
    return {ing: ing, gas: gas};
  }
  function gastosPorCategoria(mk){
    var map = {};
    movimientosDelMes(mk).forEach(function(m){
      if(m.tipo !== 'gasto') return;
      map[m.categoria] = (map[m.categoria]||0) + (Number(m.monto)||0);
    });
    return map;
  }
  function pagoDe(mk, cuentaId){
    return state.pagos[mk] && state.pagos[mk][cuentaId] ? state.pagos[mk][cuentaId] : null;
  }

  // ---------- rendering ----------
  function renderAll(){
    document.getElementById('monthLabel').textContent = monthLabelOf(currentMonthDate);
    renderInicio();
    renderMovimientos();
    renderCuentas();
    renderPresupuesto();
  }

  function renderInicio(){
    var mk = monthKeyOf(currentMonthDate);
    var t = totales(mk);
    var saldo = t.ing - t.gas;
    var saldoEl = document.getElementById('saldoNum');
    saldoEl.textContent = fmtMoney(saldo);
    saldoEl.className = 'saldo-num ' + (saldo < 0 ? 'neg' : 'pos');
    document.getElementById('ingresoTotal').textContent = fmtMoney(t.ing);
    document.getElementById('gastoTotal').textContent = fmtMoney(t.gas);

    // categorías chart
    var porCat = gastosPorCategoria(mk);
    var entries = Object.keys(porCat).map(function(k){ return {cat:k, monto:porCat[k]}; });
    entries.sort(function(a,b){ return b.monto - a.monto; });
    var maxMonto = entries.length ? entries[0].monto : 0;
    var chartHtml = '';
    if(!entries.length){
      chartHtml = '<div class="empty-state">Aún no registras gastos este mes. <button class="link-btn" data-goto="movimientos">Agregar movimiento</button></div>';
    } else {
      entries.forEach(function(e){
        var pct = maxMonto ? Math.round((e.monto/maxMonto)*100) : 0;
        chartHtml += '<div class="bar-row">' +
          '<div class="bar-row-top"><span>'+escapeHtml(e.cat)+'</span><span class="amt">'+fmtMoney(e.monto)+'</span></div>' +
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>' +
        '</div>';
      });
    }
    document.getElementById('categoriaChart').innerHTML = chartHtml;

    // próximos pagos
    var isRealCurrent = monthKeyOf(currentMonthDate) === monthKeyOf(new Date());
    var todayDay = new Date().getDate();
    var pendientes = state.cuentas.filter(function(c){
      var pago = pagoDe(mk, c.id);
      return !(pago && pago.pagado);
    }).sort(function(a,b){ return (a.dia||0) - (b.dia||0); });

    var pagosHtml = '';
    if(!state.cuentas.length){
      pagosHtml = '<div class="empty-state">Aún no registras cuentas. <button class="link-btn" data-goto="cuentas">Agregar en la pestaña Cuentas</button></div>';
    } else if(!pendientes.length){
      pagosHtml = '<div class="empty-state">Ya pagaste todas las cuentas de este mes.</div>';
    } else {
      pendientes.slice(0,6).forEach(function(c){
        var overdue = isRealCurrent && c.dia && todayDay > c.dia;
        pagosHtml += cuentaRowHtml(c, mk, overdue, true);
      });
    }
    document.getElementById('proximosPagos').innerHTML = pagosHtml;
  }

  function cuentaRowHtml(c, mk, overdue, compact){
    var estado = overdue ? 'atrasado' : 'pendiente';
    var estadoLabel = overdue ? 'Atrasado' : 'Pendiente';
    return '<div class="row" data-cuenta-row="'+c.id+'">' +
      '<div class="row-main">' +
        '<div class="row-desc">'+escapeHtml(c.nombre)+'</div>' +
        '<div class="row-meta">Vence el día '+c.dia+' &middot; '+fmtMoney(c.montoDefault)+'</div>' +
      '</div>' +
      '<div class="row-right">' +
        '<span class="pill '+estado+'">'+estadoLabel+'</span>' +
        '<button class="pay-btn" data-action="pagar" data-id="'+c.id+'">Pagar</button>' +
      '</div>' +
    '</div>';
  }

  function renderMovimientos(){
    var mk = monthKeyOf(currentMonthDate);
    document.getElementById('movListTitle').textContent = 'Movimientos de ' + monthLabelOf(currentMonthDate).toLowerCase();
    var list = movimientosDelMes(mk).slice().sort(function(a,b){ return b.fecha.localeCompare(a.fecha); });
    var html = '';
    if(!list.length){
      html = '<div class="empty-state">No hay movimientos este mes. Usa el formulario de arriba para agregar el primero.</div>';
    } else {
      list.forEach(function(m){
        html += '<div class="row" data-mov-row="'+m.id+'">' +
          '<div class="row-main">' +
            '<div class="row-desc">'+escapeHtml(m.descripcion || m.categoria)+'</div>' +
            '<div class="row-meta">'+fmtDateShort(m.fecha)+' &middot; '+escapeHtml(m.categoria)+(m.usuario ? ' &middot; '+escapeHtml(m.usuario) : '')+(m.moneda==='USD' ? ' &middot; '+fmtUSD(m.montoOriginal)+' a '+fmtMoney(m.tasaCambio) : '')+'</div>' +
          '</div>' +
          '<div class="row-right">' +
            '<span class="row-amt '+(m.tipo==='ingreso'?'ing':'gas')+'">'+(m.tipo==='ingreso'?'+':'-')+' '+fmtMoney(m.monto)+'</span>' +
            '<button class="del-btn" data-action="del-mov" data-id="'+m.id+'" aria-label="Eliminar">&times;</button>' +
          '</div>' +
        '</div>';
      });
    }
    document.getElementById('movList').innerHTML = html;
    populateCategoriaSelect();
  }

  function renderCuentas(){
    var mk = monthKeyOf(currentMonthDate);
    var isRealCurrent = mk === monthKeyOf(new Date());
    var todayDay = new Date().getDate();
    var html = '';
    if(!state.cuentas.length){
      html = '<div class="empty-state">Todavía no agregas cuentas. Registra la luz, el agua u otro servicio arriba.</div>';
    } else {
      state.cuentas.slice().sort(function(a,b){ return (a.dia||0)-(b.dia||0); }).forEach(function(c){
        var pago = pagoDe(mk, c.id);
        var pagado = !!(pago && pago.pagado);
        var overdue = !pagado && isRealCurrent && c.dia && todayDay > c.dia;
        var estado = pagado ? 'pagado' : (overdue ? 'atrasado' : 'pendiente');
        var estadoLabel = pagado ? 'Pagado' : (overdue ? 'Atrasado' : 'Pendiente');
        html += '<div data-cuenta-row="'+c.id+'">';
        html += '<div class="row">' +
          '<div class="row-main">' +
            '<div class="row-desc">'+escapeHtml(c.nombre)+'</div>' +
            '<div class="row-meta">Vence el día '+c.dia+' &middot; '+fmtMoney(c.montoDefault)+(c.recurrente?' &middot; mensual':'')+(pagado && pago.usuario ? ' &middot; Pagado por '+escapeHtml(pago.usuario) : '')+'</div>' +
          '</div>' +
          '<div class="row-right">' +
            '<span class="pill '+estado+'">'+estadoLabel+'</span>' +
            (pagado
              ? '<button class="link-btn" data-action="despagar" data-id="'+c.id+'" style="font-size:0.8rem;">Deshacer</button>'
              : '<button class="pay-btn" data-action="pagar" data-id="'+c.id+'">Pagar</button>') +
            '<button class="del-btn" data-action="del-cuenta" data-id="'+c.id+'" aria-label="Eliminar">&times;</button>' +
          '</div>' +
        '</div>';
        html += '<div class="pay-form-slot" id="payform-'+c.id+'"></div>';
        html += '</div>';
      });
    }
    document.getElementById('cuentasList').innerHTML = html;
  }

  function renderPresupuestoChart(mk){
    var porCat = gastosPorCategoria(mk);
    var entries = Object.keys(porCat).map(function(k){ return {cat:k, monto:porCat[k]}; }).filter(function(e){ return e.monto > 0; });
    entries.sort(function(a,b){ return b.monto - a.monto; });
    var total = entries.reduce(function(s,e){ return s + e.monto; }, 0);
    var container = document.getElementById('presupuestoChart');
    if(!entries.length || !total){
      container.innerHTML = '<div class="empty-state">Aún no hay gastos este mes para mostrar en el gráfico.</div>';
      return;
    }
    var r = 58, cx = 74, cy = 74, strokeWidth = 20;
    var circumference = 2 * Math.PI * r;
    var offsetAcc = 0;
    var circles = '';
    entries.forEach(function(e){
      var frac = e.monto / total;
      var len = frac * circumference;
      var color = CATEGORIA_COLORS[e.cat] || '#6B6B5C';
      circles += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+strokeWidth+'" stroke-dasharray="'+len+' '+(circumference-len)+'" stroke-dashoffset="'+(-offsetAcc)+'"/>';
      offsetAcc += len;
    });
    var svg = '<svg viewBox="0 0 148 148" width="148" height="148" style="transform:rotate(-90deg);flex-shrink:0;">'+circles+'</svg>';
    var legend = '<div class="legend">' + entries.map(function(e){
      var pct = Math.round((e.monto/total)*100);
      var color = CATEGORIA_COLORS[e.cat] || '#6B6B5C';
      return '<div class="legend-item"><span class="legend-swatch" style="background:'+color+'"></span><span class="name">'+escapeHtml(e.cat)+'</span><span class="pct">'+pct+'% &middot; '+fmtMoney(e.monto)+'</span></div>';
    }).join('') + '</div>';
    container.innerHTML = '<div class="donut-wrap">'+svg+legend+'</div>';
  }

  function renderPresupuesto(){
    var mk = monthKeyOf(currentMonthDate);
    renderPresupuestoChart(mk);
    document.getElementById('presupuestoTitle').textContent = 'Presupuesto de ' + monthLabelOf(currentMonthDate).toLowerCase();
    var porCat = gastosPorCategoria(mk);
    var html = '';
    CATEGORIAS_GASTO.forEach(function(cat){
      var limite = state.presupuestos[cat] || 0;
      var gastado = porCat[cat] || 0;
      var pct = limite ? Math.min(100, Math.round((gastado/limite)*100)) : 0;
      var barClass = 'ok';
      if(limite){
        if(gastado > limite) barClass = 'over';
        else if(pct >= 80) barClass = 'warn';
      }
      html += '<div class="budget-row">' +
        '<div class="budget-row-top">' +
          '<span class="cat">'+escapeHtml(cat)+'</span>' +
          '<div class="budget-input"><span>$</span><input type="number" min="0" step="1" data-cat="'+encodeURIComponent(cat)+'" value="'+(limite||'')+'" placeholder="0"></div>' +
        '</div>' +
        (limite
          ? '<div class="bar-track"><div class="bar-fill '+barClass+'" style="width:'+pct+'%"></div></div>' +
            '<div class="budget-progress-label"><span>'+fmtMoney(gastado)+' gastado</span><span>de '+fmtMoney(limite)+'</span></div>'
          : '<div class="budget-progress-label"><span>'+fmtMoney(gastado)+' gastado</span><span>Sin presupuesto definido</span></div>'
        ) +
      '</div>';
    });
    document.getElementById('presupuestoList').innerHTML = html;
  }

  function populateCategoriaSelect(){
    var sel = document.getElementById('movCategoria');
    var cats = currentTipo === 'ingreso' ? CATEGORIAS_INGRESO : CATEGORIAS_GASTO;
    var prev = sel.value;
    sel.innerHTML = cats.map(function(c){ return '<option value="'+escapeHtml(c)+'">'+escapeHtml(c)+'</option>'; }).join('');
    if(cats.indexOf(prev) !== -1) sel.value = prev;
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------- actions ----------
  async function addMovimiento(){
    var fecha = document.getElementById('movFecha').value || todayISO();
    var categoria = document.getElementById('movCategoria').value;
    var descripcion = document.getElementById('movDescripcion').value.trim();
    var montoVal = document.getElementById('movMonto').value;
    var montoIngresado = Number(montoVal);
    if(!montoIngresado || montoIngresado <= 0){
      showToast('Ingresa un monto válido.', null);
      return;
    }
    var mov = { id: uid(), fecha: fecha, tipo: currentTipo, categoria: categoria, descripcion: descripcion, usuario: currentUser, moneda: currentMoneda };
    if(currentMoneda === 'USD'){
      if(!exchangeRate || !exchangeRate.valor){
        showToast('No hay tasa del dólar disponible todavía. Intenta de nuevo en un momento.', null);
        return;
      }
      mov.montoOriginal = montoIngresado;
      mov.tasaCambio = exchangeRate.valor;
      mov.monto = Math.round(montoIngresado * exchangeRate.valor);
    } else {
      mov.montoOriginal = montoIngresado;
      mov.monto = montoIngresado;
    }
    state.movimientos.push(mov);
    await saveState();
    document.getElementById('movDescripcion').value = '';
    document.getElementById('movMonto').value = '';
    updateFxHint();
    // saltar a ver el mes del movimiento agregado
    var d = new Date(fecha + 'T00:00:00');
    currentMonthDate = startOfMonth(d);
    renderAll();
  }

  async function deleteMovimiento(id){
    var idx = state.movimientos.findIndex(function(m){ return m.id === id; });
    if(idx === -1) return;
    var item = state.movimientos[idx];
    state.movimientos.splice(idx,1);
    await saveState();
    renderAll();
    showToast('Movimiento eliminado.', async function(){
      state.movimientos.splice(idx,0,item);
      await saveState();
      renderAll();
    });
  }

  async function addCuenta(){
    var nombre = document.getElementById('cuentaNombre').value.trim();
    var monto = Number(document.getElementById('cuentaMonto').value);
    var dia = Number(document.getElementById('cuentaDia').value);
    var recurrente = document.getElementById('cuentaRecurrente').checked;
    if(!nombre){ showToast('Escribe el nombre de la cuenta.', null); return; }
    if(!dia || dia < 1 || dia > 31){ showToast('Ingresa un día entre 1 y 31.', null); return; }
    var cuenta = { id: uid(), nombre: nombre, montoDefault: monto || 0, dia: dia, recurrente: recurrente };
    state.cuentas.push(cuenta);
    await saveState();
    document.getElementById('cuentaNombre').value = '';
    document.getElementById('cuentaMonto').value = '';
    document.getElementById('cuentaDia').value = '';
    document.getElementById('cuentaRecurrente').checked = true;
    renderAll();
  }

  async function deleteCuenta(id){
    var idx = state.cuentas.findIndex(function(c){ return c.id === id; });
    if(idx === -1) return;
    var item = state.cuentas[idx];
    state.cuentas.splice(idx,1);
    await saveState();
    renderAll();
    showToast('Cuenta eliminada.', async function(){
      state.cuentas.splice(idx,0,item);
      await saveState();
      renderAll();
    });
  }

  function openPayForm(cuentaId){
    var cuenta = state.cuentas.find(function(c){ return c.id === cuentaId; });
    if(!cuenta) return;
    var slots = document.querySelectorAll('.pay-form-slot');
    slots.forEach(function(s){ s.innerHTML = ''; });
    var slot = document.getElementById('payform-'+cuentaId);
    if(!slot) return; // (fila en Inicio, sin slot: pagar directo con monto por defecto)
    slot.innerHTML =
      '<div class="pay-form">' +
        '<div class="row-inline">' +
          '<div class="field" style="flex:1;margin-bottom:0;"><label>Monto pagado</label>' +
          '<input type="number" min="0" step="1" id="payAmount-'+cuentaId+'" value="'+cuenta.montoDefault+'"></div>' +
          '<button class="pay-btn" data-action="confirmar-pago" data-id="'+cuentaId+'">Confirmar pago</button>' +
          '<button class="link-btn" data-action="cancelar-pago" data-id="'+cuentaId+'">Cancelar</button>' +
        '</div>' +
      '</div>';
  }

  function closePayForm(cuentaId){
    var slot = document.getElementById('payform-'+cuentaId);
    if(slot) slot.innerHTML = '';
  }

  async function confirmarPago(cuentaId, montoOverride){
    var cuenta = state.cuentas.find(function(c){ return c.id === cuentaId; });
    if(!cuenta) return;
    var mk = monthKeyOf(currentMonthDate);
    var input = document.getElementById('payAmount-'+cuentaId);
    var monto = montoOverride != null ? montoOverride : (input ? Number(input.value) : cuenta.montoDefault);
    if(!monto || monto <= 0) monto = cuenta.montoDefault || 0;

    if(!state.pagos[mk]) state.pagos[mk] = {};
    state.pagos[mk][cuentaId] = { pagado: true, monto: monto, fecha: todayISO(), usuario: currentUser };

    state.movimientos.push({
      id: uid(), fecha: todayISO(), tipo: 'gasto',
      categoria: 'Servicios básicos', descripcion: cuenta.nombre, monto: monto, usuario: currentUser
    });

    await saveState();
    renderAll();
    var pill = document.querySelector('[data-cuenta-row="'+cuentaId+'"] .pill');
    if(pill) pill.classList.add('pop');
  }

  async function deshacerPago(cuentaId){
    var mk = monthKeyOf(currentMonthDate);
    if(state.pagos[mk]) delete state.pagos[mk][cuentaId];
    await saveState();
    renderAll();
  }

  // ---------- usuarios ----------
  function updateUserGreeting(){
    var el = document.getElementById('userGreeting');
    if(el) el.textContent = currentUser ? 'Hola, ' + currentUser : '';
  }
  function showLogin(){
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
  }
  function enterApp(user){
    currentUser = user;
    try{ sessionStorage.setItem(USER_SESSION_KEY, user); }catch(e){}
    updateUserGreeting();
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
  }

  // ---------- navegación ----------
  function showSection(name){
    document.querySelectorAll('.section').forEach(function(s){ s.classList.remove('active'); });
    document.getElementById('sec-'+name).classList.add('active');
    var buttons = Array.prototype.slice.call(document.querySelectorAll('nav.bottom button[data-target]'));
    var idx = 0;
    buttons.forEach(function(b, i){
      var active = b.getAttribute('data-target') === name;
      b.classList.toggle('active', active);
      if(active) idx = i;
    });
    document.getElementById('navIndicator').style.transform = 'translateX(' + (idx*100) + '%)';
  }

  // ---------- eventos ----------
  function bindEvents(){
    document.getElementById('prevMonth').addEventListener('click', function(){
      currentMonthDate = new Date(currentMonthDate.getFullYear(), currentMonthDate.getMonth()-1, 1);
      renderAll();
    });
    document.getElementById('nextMonth').addEventListener('click', function(){
      currentMonthDate = new Date(currentMonthDate.getFullYear(), currentMonthDate.getMonth()+1, 1);
      renderAll();
    });

    document.getElementById('bottomNav').addEventListener('click', function(e){
      var btn = e.target.closest('button[data-target]');
      if(btn) showSection(btn.getAttribute('data-target'));
    });

    document.getElementById('tipoToggle').addEventListener('click', function(e){
      var btn = e.target.closest('button[data-tipo]');
      if(!btn) return;
      currentTipo = btn.getAttribute('data-tipo');
      document.querySelectorAll('#tipoToggle button').forEach(function(b){ b.classList.toggle('active', b === btn); });
      populateCategoriaSelect();
    });

    document.getElementById('monedaToggle').addEventListener('click', function(e){
      var btn = e.target.closest('button[data-moneda]');
      if(!btn) return;
      currentMoneda = btn.getAttribute('data-moneda');
      document.querySelectorAll('#monedaToggle button').forEach(function(b){ b.classList.toggle('active', b === btn); });
      var montoInput = document.getElementById('movMonto');
      var label = document.getElementById('movMontoLabel');
      if(currentMoneda === 'USD'){
        montoInput.step = '0.01';
        label.textContent = 'Monto en dólares (USD)';
        ensureExchangeRate(false);
      } else {
        montoInput.step = '1';
        label.textContent = 'Monto';
      }
      updateFxHint();
    });

    document.getElementById('movMonto').addEventListener('input', updateFxHint);

    document.getElementById('fxHint').addEventListener('click', function(e){
      if(e.target.closest('#refreshRateBtn')) ensureExchangeRate(true);
    });

    document.getElementById('addMovBtn').addEventListener('click', addMovimiento);
    document.getElementById('addCuentaBtn').addEventListener('click', addCuenta);

    document.getElementById('movFecha').value = todayISO();

    document.getElementById('movList').addEventListener('click', function(e){
      var btn = e.target.closest('button[data-action="del-mov"]');
      if(btn) deleteMovimiento(btn.getAttribute('data-id'));
    });

    document.getElementById('cuentasList').addEventListener('click', function(e){
      var target = e.target;
      var pagar = target.closest('button[data-action="pagar"]');
      var confirmar = target.closest('button[data-action="confirmar-pago"]');
      var cancelar = target.closest('button[data-action="cancelar-pago"]');
      var despagar = target.closest('button[data-action="despagar"]');
      var del = target.closest('button[data-action="del-cuenta"]');
      if(pagar) openPayForm(pagar.getAttribute('data-id'));
      else if(confirmar) confirmarPago(confirmar.getAttribute('data-id'));
      else if(cancelar) closePayForm(cancelar.getAttribute('data-id'));
      else if(despagar) deshacerPago(despagar.getAttribute('data-id'));
      else if(del) deleteCuenta(del.getAttribute('data-id'));
    });

    document.getElementById('proximosPagos').addEventListener('click', function(e){
      var pagar = e.target.closest('button[data-action="pagar"]');
      if(pagar) confirmarPago(pagar.getAttribute('data-id'));
    });

    document.getElementById('presupuestoList').addEventListener('change', function(e){
      var input = e.target.closest('input[data-cat]');
      if(!input) return;
      var cat = decodeURIComponent(input.getAttribute('data-cat'));
      var val = Number(input.value) || 0;
      if(val > 0) state.presupuestos[cat] = val;
      else delete state.presupuestos[cat];
      saveState().then(renderPresupuesto);
    });

    document.addEventListener('click', function(e){
      var goto = e.target.closest('button[data-goto]');
      if(goto) showSection(goto.getAttribute('data-goto'));
    });

    document.getElementById('userCards').addEventListener('click', function(e){
      var btn = e.target.closest('button[data-user]');
      if(btn) enterApp(btn.getAttribute('data-user'));
    });
    document.getElementById('switchUserBtn').addEventListener('click', function(){
      try{ sessionStorage.removeItem(USER_SESSION_KEY); }catch(e){}
      showLogin();
    });
  }

  // ---------- init ----------
  async function init(){
    await loadState();
    populateCategoriaSelect();
    bindEvents();
    renderAll();
    ensureExchangeRate(false); // en segundo plano, no bloquea la carga
    document.getElementById('loading').style.display = 'none';

    var savedUser = null;
    try{ savedUser = sessionStorage.getItem(USER_SESSION_KEY); }catch(e){}
    if(savedUser && USERS.indexOf(savedUser) !== -1){
      enterApp(savedUser);
    } else {
      showLogin();
    }
  }

  init();
})();
</script>
</body>
</html>
